services:
  backend:
    image: ghcr.io/${GHCR_NAMESPACE}/nova:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - NOVA_PORT=9527
      - NOVA_AUTOINSTALL=0
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - NOVA_DB_PATH=/home/node/.novaworkbench/data/nova.db
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=9527
      - HTTPS_METHOD=noredirect
    volumes:
      # Shared DB + NovaWorkbench state across ALL preview environments —
      # every req-xxx.nova preview reads/writes the same nova.db. Mount paths
      # under /home/node because the container runs as the non-root `node`
      # user (Claude CLI refuses --dangerously-skip-permissions under uid 0).
      - ${HOME}/nova/preview/data:/home/node/.novaworkbench
      # Per-project workspace stays per-project (different branches clone
      # different repos into /home/node/workspace).
      - ${HOME}/nova/preview/${PROJECT_NAME}/workspace:/home/node/workspace
      # Shared claude CLI session transcripts + plan files across all preview
      # stacks. Each preview project's transcripts are naturally isolated by
      # claude CLI's cwd-hash under ~/.claude/projects/<encoded-cwd>/, so
      # sessions from different features don't collide. Entrypoint chowns the
      # bind-mount to node (UID 1000).
      - ${HOME}/nova/preview/claude:/home/node/.claude
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy