services:
  backend:
    image: ghcr.io/${GHCR_NAMESPACE}/nova:${IMAGE_TAG:-latest}
    container_name: nova-prod-backend
    restart: always
    environment:
      - NOVA_PORT=9527
      - NOVA_AUTOINSTALL=0
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - VIRTUAL_HOST=prod.nova.yishield.com
      - VIRTUAL_PORT=9527
      - HTTPS_METHOD=noredirect
    volumes:
      # Container runs as the non-root `node` user (UID 1000, from the node
      # base image) — see backend/Dockerfile + docker-entrypoint.sh. The
      # entrypoint migrates existing /root/... state once so this change is
      # drop-in.
      - ${HOME}/nova/prod/data:/home/node/.novaworkbench
      - ${HOME}/nova/prod/workspace:/home/node/workspace
      # Persist claude CLI session transcripts + plan files so re-deploying
      # the container keeps in-progress wizard/codegen sessions alive for
      # --resume. Container runs as `node` (HOME=/home/node), so the in-container
      # path is /home/node/.claude. Entrypoint chowns the bind-mount.
      - ${HOME}/nova/prod/claude:/home/node/.claude
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy