services:
  backend:
    image: ghcr.io/${GHCR_NAMESPACE}/nova:${IMAGE_TAG:-latest}
    container_name: nova-prod-backend
    restart: always
    environment:
      - NOVA_PORT=9527
      - NOVA_AUTOINSTALL=0
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - VIRTUAL_HOST=prod.nova.yishield.com
      - VIRTUAL_PORT=9527
      - HTTPS_METHOD=noredirect
    volumes:
      # Container runs as the non-root nova user (UID 1000) — see
      # backend/Dockerfile + docker-entrypoint.sh. The entrypoint migrates
      # existing /root/... state once so this change is drop-in.
      - ${HOME}/nova/prod/data:/home/nova/.novaworkbench
      - ${HOME}/nova/prod/workspace:/home/nova/workspace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy