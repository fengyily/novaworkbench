name: CI

# WHY THIS WORKFLOW EXISTS
#
# Until 2026-10-24 the repo had no test job at all (only deploy / release /
# terraform). That is how backend/internal/handler/fs_test.go — which built
# paths from the REAL $HOME and then `defer os.RemoveAll($HOME/workspace)` —
# survived for 12 days and, on 2026-10-24, deleted seven live project
# checkouts on a developer machine mid-task. A CI job that runs the suite can
# not prevent that specific class of bug (CI has no ~/workspace to lose), but
# it does keep the suite green and compiling, which is the precondition for
# catching the next one locally.
#
# HOME is additionally sandboxed for the run, so a test that reaches for
# ~/workspace, ~/.novaworkbench or ~/.gnupg writes into a throwaway dir.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Sandbox the home directory for the whole job — see the header note.
      HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Prepare sandbox HOME
        run: mkdir -p "$HOME"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    name: frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
