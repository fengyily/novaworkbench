# Release pipeline — fully decoupled from deploy.yml (which keeps handling
# main/feat-* image pushes + SSH deploys). This workflow only fires on `v*`
# tag pushes (and manual dispatch) and produces:
#
#   1. Cross-compiled binaries for 5 platforms via scripts/build-all.sh
#      (frontend embedded into each binary), version stamped via ldflags.
#   2. tar.gz (Unix) / zip (Windows) archives + a sha256 checksums file.
#   3. A multi-arch (linux/amd64 + linux/arm64) Docker image on GHCR, tagged
#      with the release version, the commit SHA, and `latest` (stable only).
#   4. A GitHub Release with the archives attached.
#
# Everything runs on a single ubuntu runner: CGO_ENABLED=0 cross-compilation
# needs no per-OS matrix. Tags should be cut from main only — a tag pushed
# from a feat/* branch would additionally trigger deploy.yml's preview job,
# which is allowed but not recommended (see docs/RELEASE.md).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0; must already exist in the repo). Pass "__refresh-base-cache__" instead to refresh the GHCR base-image cache (see refresh-base-cache job).'
        required: false
        default: 'v0.0.0-test'
        type: string
      # NOTE: dispatch inputs are surfaced as STRINGS ('true' / 'false'), not
      # YAML booleans — keep the comparison `inputs.build_image == 'true'`
      # in the image steps in sync with this convention.
      build_image:
        description: 'Build & push the multi-arch (linux/amd64 + linux/arm64) Docker image to GHCR as part of this release. Default false: push-tag runs and the default dispatch path produce only binaries + archives + apt packages + GitHub Release, with no GHCR image. Set true only when the release should also ship a container image.'
        required: false
        default: 'false'
        type: boolean

# Serialize per tag: a re-pushed tag or a dispatch replay must never run
# concurrently with a live release for the same version.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || format('tag-{0}', inputs.tag) }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release
  packages: write    # push the multi-arch image to GHCR

env:
  NAMESPACE: ${{ vars.GHCR_NAMESPACE || github.repository_owner }}

jobs:
  # Initialise / refresh the GHCR mirror of the upstream Dockerfile base
  # images (node:22-alpine, golang:1.25-alpine). Both `release` and
  # `deploy` reference these via `cache-from:
  # type=registry,ref=ghcr.io/<ns>/nova-buildcache:<base>` so the actual
  # multi-arch build never has to talk to Cloudflare-fronted
  # auth.docker.io — which 401-RSTs concurrent multi-arch pulls on
  # hosted runners roughly every other run. Manual-only because the
  # one-time setup needs the GHCR package to exist (run once after
  # enabling GHCR on the repo); subsequent runs only matter when an
  # upstream base image bumps (alpine patch release).
  #
  # Implementation: use `docker buildx imagetools create` with
  # `--tag` multi-arch, which under the hood pulls each arch's manifest
  # from docker.io once on the runner and pushes a single multi-arch
  # manifest list to GHCR. Downstream `cache-from` then matches per-arch
  # digest against the buildx build context. `docker manifest create
  # + annotate` (the alternative) requires per-arch digest lookups and
  # rejects `BASE` image refs without `manifest inspect`-style prior
  # resolution, so we sidestep it here.
  refresh-base-cache:
    if: github.event_name == 'workflow_dispatch' && inputs.tag == '__refresh-base-cache__'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull multi-arch base and push to GHCR
        env:
          NS: ${{ vars.GHCR_NAMESPACE || github.repository_owner }}
        run: |
          # Lowercase owner — GHCR image names must be all-lowercase.
          NS="$(printf '%s' "$NS" | tr '[:upper:]' '[:lower:]')"
          set -euo pipefail
          # Each BASE goes once through buildx imagetools, which expands
          # the multi-arch manifest into per-arch digests under the hood.
          # Tag-safe variant: replace ':' with '-' so the GHCR tag is
          # `node-22-alpine` instead of `node:22-alpine`.
          docker buildx imagetools create \
            --tag "ghcr.io/${NS}/nova-buildcache:node-22-alpine" \
            "docker.io/library/node:22-alpine"
          docker buildx imagetools create \
            --tag "ghcr.io/${NS}/nova-buildcache:golang-1.25-alpine" \
            "docker.io/library/golang:1.25-alpine"

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Push → the tag ref itself (must exist by definition of the trigger).
          # Dispatch → the tag often does not exist yet (workflow_dispatch is
          # the supported way to pre-stamp a future version); fall back to the
          # default branch HEAD. The metadata step still stamps inputs.tag as
          # the version, so the produced binaries / GHCR tags / GitHub Release
          # carry the requested version string regardless of which commit was
          # checked out.
          ref: ${{ github.event_name == 'push' && github.ref || '' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # zip is not guaranteed on ubuntu runners; needed for the Windows
      # archive below.
      - name: Install zip
        run: sudo apt-get update -q && sudo apt-get install -y -q zip

      - name: Resolve version metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.tag }}"
          fi
          # ldflags values must not carry spaces/quotes — keep [A-Za-z0-9._-]
          VERSION="$(printf '%s' "$VERSION" | tr -cd '[:alnum:]._-' | cut -c1-32)"
          COMMIT="$(git rev-parse HEAD)"
          # GHCR image names must be all-lowercase; the owner may not be.
          echo "namespace=$(printf '%s' "${NAMESPACE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} @ ${COMMIT}"

      # Surface the build_image gate decision to the operator before any
      # work begins. Intentionally NOT gated with `if:` — its job is to
      # announce when the image step was *skipped*, so a green-but-
      # image-less run can be distinguished from a green run that
      # actually pushed to GHCR. push-tag runs surface as SKIPPED here
      # because inputs.build_image is null and `|| 'false'` falls
      # through to the SKIPPED branch.
      - name: Report image-build gate state
        env:
          GATE: ${{ inputs.build_image || 'false' }}
        run: |
          if [ "$GATE" = "true" ]; then
            echo "::notice::image build ENABLED (build_image=true) — multi-arch GHCR image will be pushed"
          else
            echo "::notice::image build SKIPPED (build_image unset or false) — no GHCR image will be produced for this release"
          fi

      - name: Build all platform binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: scripts/build-all.sh --with-frontend --skip-deps-check

      # Boot the freshly built linux/amd64 binary and assert /api/health
      # reports the injected version — catches ldflags regressions before
      # anything is published.
      - name: Verify version stamp
        env:
          NOVA_PORT: '19527'
          NOVA_AUTOINSTALL: '0'   # skip the background claude-CLI install probe
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./dist/novaworkbench-linux-amd64 > /tmp/nova-verify.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:19527/api/health > /tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "--- /api/health ---"
          cat /tmp/health.json; echo
          grep -q "\"version\":\"${VERSION}\"" /tmp/health.json

      # .deb packaging for the apt repo. nfpm is a Go-native, config-driven
      # packager — no dpkg toolchain on the runner. The build runs from the
      # repo root so ../dist/novaworkbench-linux-${ARCH} resolves correctly
      # (matches the src path in packaging/nfpm.yaml).
      - name: Install nfpm
        run: |
          NFPM_VERSION="v2.38.0"
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build .deb packages
        env:
          # Debian package versions may not carry a leading "v" (it is part of
          # the git tag convention, not the upstream version scheme). release-
          # please-managed tags always start with "v", so strip it for nfpm.
          DEB_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          VERSION="${DEB_VERSION#v}"
          mkdir -p dist/debs
          # nfpm expands $VAR / ${VAR} in the YAML from the process
          # environment (it has no --env CLI flag). Each loop iteration
          # exports VERSION + ARCH inline before invoking nfpm so the same
          # config file renders both arch-specific packages.
          for ARCH in amd64 arm64; do
            VERSION="$VERSION" ARCH="$ARCH" nfpm package \
              --config packaging/nfpm.yaml \
              --target dist/debs/ \
              --packager deb
          done
          ls -lh dist/debs/

      - name: Package archives + checksums
        run: |
          cd dist
          V="${{ steps.meta.outputs.version }}"
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            tar -czf "novaworkbench-${V}-${target}.tar.gz" "novaworkbench-${target}"
          done
          zip -q "novaworkbench-${V}-windows-amd64.zip" "novaworkbench-windows-amd64.exe"
          sha256sum "novaworkbench-${V}-"*.tar.gz "novaworkbench-${V}-"*.zip > "novaworkbench-${V}-checksums.txt"
          ls -lh

      - name: Compute image tags
        id: imgtags
        if: github.event_name == 'workflow_dispatch' && inputs.build_image == 'true'
        run: |
          IMAGE="ghcr.io/${{ steps.meta.outputs.namespace }}/nova"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${{ steps.meta.outputs.version }}"
            echo "${IMAGE}:sha-${{ steps.meta.outputs.commit }}"
            # Pre-release suffixes (v0.0.0-test, v0.2.0-rc1) must NOT move
            # the stable `latest` pointer.
            case "${{ steps.meta.outputs.version }}" in
              *-*) ;;
              *) echo "${IMAGE}:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.build_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU is required to execute the arm64 build stages (npm/go RUN
      # commands) on the amd64 hosted runner.
      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && inputs.build_image == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' && inputs.build_image == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          # mirror.gcr.io is Google's read-only Docker Hub cache; routes
          # pulls for `docker.io/*` through it to avoid auth.docker.io RST
          # spikes on hosted runners (manifest-layer pull deadlocked ~50%
          # of release runs before this was added — see release.yml git
          # history). mirror failures fall back to the upstream registry
          # automatically, so this is a pure latency / reliability win.
          buildkitd-config: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]

      - name: Build & push release image (multi-arch)
        if: github.event_name == 'workflow_dispatch' && inputs.build_image == 'true'
        uses: docker/build-push-action@v5
        with:
          # Same root context as deploy.yml — the Dockerfile's COPY paths
          # reference both frontend/... and backend/....
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: ${{ steps.imgtags.outputs.tags }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.meta.outputs.namespace }}/nova-buildcache:node-22-alpine
            type=registry,ref=ghcr.io/${{ steps.meta.outputs.namespace }}/nova-buildcache:golang-1.25-alpine
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          NS: ${{ steps.meta.outputs.namespace }}
          BUILD_IMAGE: ${{ inputs.build_image || 'false' }}
        run: |
          # Re-run safety: drop a previous release for this tag but keep the
          # tag itself, so `gh release create` re-attaches to the same commit.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::warning::Release ${VERSION} already exists — recreating it"
            gh release delete "$VERSION" --yes
          fi
          # Conditionally append a Docker pull block to release notes — only
          # when the image was actually pushed to GHCR. Default
          # build_image=false leaves a clean notes body without a `docker
          # pull` line that would 404 against a tag that was never published
          # as a container image.
          DOCKER_NOTE=""
          if [ "$BUILD_IMAGE" = "true" ]; then
            DOCKER_NOTE="

          Docker 镜像（amd64 / arm64 自动匹配）：
          \`\`\`bash
          docker pull ghcr.io/${NS}/nova:${VERSION}
          \`\`\`"
          fi
          gh release create "$VERSION" \
            dist/novaworkbench-*.tar.gz \
            dist/novaworkbench-*.zip \
            dist/novaworkbench-*-checksums.txt \
            dist/debs/*.deb \
            --title "$VERSION" \
            --generate-notes \
            --notes "### 下载二进制

          | 平台 | 架构 | 文件 |
          |------|------|------|
          | macOS | Apple Silicon | \`novaworkbench-${VERSION}-darwin-arm64.tar.gz\` |
          | macOS | Intel | \`novaworkbench-${VERSION}-darwin-amd64.tar.gz\` |
          | Linux | x86_64 | \`novaworkbench-${VERSION}-linux-amd64.tar.gz\` |
          | Linux | arm64 | \`novaworkbench-${VERSION}-linux-arm64.tar.gz\` |
          | Windows | x86_64 | \`novaworkbench-${VERSION}-windows-amd64.zip\` |

          apt 仓库（Debian / Ubuntu，amd64 + arm64）：
          \`\`\`bash
          echo \"deb [trusted=yes] https://<PAGES_HOST>/apt stable main\" \\
            | sudo tee /etc/apt/sources.list.d/nova.list
          sudo apt update && sudo apt install nova
          sudo useradd --create-home --home-dir /home/nova --shell /bin/bash nova
          sudo nova install
          \`\`\`

          解压后直接运行（macOS / Linux）：
          \`\`\`bash
          tar -xzf novaworkbench-${VERSION}-<os>-<arch>.tar.gz
          ./novaworkbench-<os>-<arch>   # 监听 :9527
          \`\`\`${DOCKER_NOTE}

          校验下载：\`sha256sum -c novaworkbench-${VERSION}-checksums.txt\`
          完整使用说明见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)。"
          gh release view "$VERSION" --json url --jq '.url'

      # Standalone apt repo at github.com/fengyily/linux-repo (mirrors the
      # shield-cli distribution shape: a separate apt-only repo so the
      # main codebase stays free of gh-pages noise). Referenced via
      # "[trusted=yes]" in /etc/apt/sources.list.d/nova.list — no GPG
      # signing required (see docs/RELEASE.md#apt-仓库发布).
      #
      # APT_REPO_TOKEN is REQUIRED: linux-repo is a different repository
      # from this workflow's GITHUB_REPOSITORY, so the auto-injected
      # GITHUB_TOKEN has zero access to it. The PAT must have `contents:
      # write` on fengyily/linux-repo. Users consume the repo via GitHub
      # Pages — Settings → Pages → Branch: main / root must be enabled on
      # linux-repo for `https://fengyily.github.io/linux-repo/` to serve
      # the apt tree.
      - name: Publish to apt repo (fengyily/linux-repo)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: |
          # apt-ftparchive is part of the ubuntu-runner image (apt-utils).
          # If it ever disappears, install with: sudo apt-get install -y apt-utils
          command -v apt-ftparchive >/dev/null \
            || { echo "::error::apt-ftparchive not found (install apt-utils)"; exit 1; }

          if [ -z "$APT_REPO_TOKEN" ]; then
            echo "::error::secrets.APT_REPO_TOKEN is not configured — required to push to fengyily/linux-repo (see docs/RELEASE.md#apt-仓库发布)"
            exit 1
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global advice.detachedHead false

          WORK="$(mktemp -d)"
          REPO_URL="https://x-access-token:${APT_REPO_TOKEN}@github.com/fengyily/linux-repo.git"

          # First-time publish: the repo may be entirely empty (no commits
          # on the default branch yet). `git clone --depth 1` of an empty
          # repo fails with "warning: Could not find remote branch", so we
          # detect the failure and fall back to a local init + push -u to
          # create the upstream ref. The `if ... else ... fi` pattern keeps
          # stderr from the failing clone from being surfaced as a step
          # error.
          if git clone --depth 1 "$REPO_URL" "$WORK/apt" 2>/dev/null; then
            cd "$WORK/apt"
          else
            echo "::notice::linux-repo is empty / no default branch; initializing orphan main"
            mkdir -p "$WORK/apt"
            cd "$WORK/apt"
            git init -q
            git checkout -q --orphan main
            git remote add origin "$REPO_URL"
          fi

          # First-ever publish: clone of an empty / uninitialized gh-pages
          # branch leaves the working dir with only .git/. Create the
          # skeleton so apt-ftparchive has somewhere to write.
          mkdir -p pool/main/n/nova
          mkdir -p dists/stable/main/binary-amd64
          mkdir -p dists/stable/main/binary-arm64

          # Per-arch pool subdirectories. Splitting debs into per-arch
          # subdirs lets `apt-ftparchive packages <path>` scan only that
          # arch and emit a clean Packages file without any filter flag —
          # works across every apt-utils version we ship on.
          for ARCH in amd64 arm64; do
            ARCH_POOL="pool/main/n/nova/binary-${ARCH}"
            mkdir -p "$ARCH_POOL"
            # Glob MUST live outside double quotes for bash to expand it.
            # The previous `cp -v "$GITHUB_WORKSPACE/dist/debs/nova_*_${ARCH}.deb"`
            # passed `nova_*_${ARCH}.deb` as a literal string (no file with
            # `*` in its name exists), so cp exited 1 even though the build
            # step had produced the matching `nova_<ver>_<arch>.deb`. A for
            # loop expands the glob at iteration time; the `[ -f ]` guard
            # makes a non-matching literal pattern a clean no-op instead of
            # tripping `set -e` on cp's nonzero exit.
            for deb in "$GITHUB_WORKSPACE"/dist/debs/nova_*_"${ARCH}".deb; do
              [ -f "$deb" ] || continue
              cp -v "$deb" "$ARCH_POOL/"
            done
            apt-ftparchive packages "$ARCH_POOL" \
              > "dists/stable/main/binary-${ARCH}/Packages"
            gzip -9kf "dists/stable/main/binary-${ARCH}/Packages"
          done

          # Top-level Release (no InRelease / Release.gpg because the apt
          # source uses [trusted=yes]).
          apt-ftparchive release dists/stable > dists/stable/Release

          git add -A
          if git diff --cached --quiet; then
            echo "::notice::no apt repo changes; skipping commit"
          else
            # --no-verify skips any pre-commit hooks shipped on the repo
            # (there shouldn't be any, but be defensive).
            git commit --no-verify -m "apt: publish nova ${VERSION#v}"
            # First push on an empty repo: use `-u` to set upstream. On a
            # populated repo: a plain `push` to the current branch works
            # because clone set up `origin/HEAD`. We use a single branch
            # name (`HEAD:refs/heads/<branch>`) so the same command line
            # works whether HEAD is on `main` (the local orphan we just
            # created) or some other default branch.
            BRANCH="$(git symbolic-ref --short HEAD 2>/dev/null || echo main)"
            # Retry once on transient network failures; surface permanent
            # failures (auth, branch protection, missing scope) as errors so
            # the workflow run is visibly red instead of silently green.
            if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
              echo "::warning::first push attempt failed; retrying after 5s"
              sleep 5
              git push origin "HEAD:refs/heads/${BRANCH}" \
                || { echo "::error::push to fengyily/linux-repo failed twice — likely causes: (a) APT_REPO_TOKEN expired/revoked or missing 'contents: write' on fengyily/linux-repo; (b) branch protection on '$BRANCH' requires a PR; (c) linux-repo is read-only/fork-only. Fix the upstream cause; do NOT bypass by switching back to in-repo gh-pages."; exit 1; }
            fi
          fi
