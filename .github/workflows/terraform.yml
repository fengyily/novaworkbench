name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      auto_approve:
        description: 'Skip the -auto-approve flag (only applies to apply / destroy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      server_public_ip:
        description: 'Public IPv4 of the ECS (required for plan/apply/destroy)'
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write terraform.tfvars
        env:
          SERVER_IP: ${{ inputs.server_public_ip }}
        run: |
          cat > terraform.tfvars <<EOF
          server_public_ip = "$SERVER_IP"
          EOF

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        env:
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform ${{ inputs.action }}
        id: tf
        env:
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          TF_AUTO_APPROVE: ${{ inputs.auto_approve }}
        run: |
          ARGS=()
          if [[ "${{ inputs.action }}" != "plan" && "$TF_AUTO_APPROVE" == "true" ]]; then
            ARGS+=("-auto-approve")
          fi
          terraform ${{ inputs.action }} -var-file=terraform.tfvars -input=false "${ARGS[@]}"

      - name: terraform output (apply only)
        if: inputs.action == 'apply' && steps.tf.outputs.exitcode == '0'
        env:
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
        run: |
          echo "## Terraform apply output" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY