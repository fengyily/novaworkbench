name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      auto_approve:
        description: 'Skip the interactive confirmation prompt (apply / destroy only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        env:
          # Sensitive credentials (Secrets — masked in logs)
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          # Non-sensitive runtime value (Variable — visible in logs)
          TF_VAR_server_public_ip: ${{ vars.SERVER_PUBLIC_IP }}
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform ${{ inputs.action }}
        id: tf
        env:
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          TF_VAR_server_public_ip: ${{ vars.SERVER_PUBLIC_IP }}
          TF_AUTO_APPROVE: ${{ inputs.auto_approve }}
        run: |
          ARGS=()
          if [[ "${{ inputs.action }}" != "plan" && "$TF_AUTO_APPROVE" == "true" ]]; then
            ARGS+=("-auto-approve")
          fi
          terraform ${{ inputs.action }} -input=false "${ARGS[@]}"

      - name: terraform output (apply only)
        if: inputs.action == 'apply' && steps.tf.outputs.exitcode == '0'
        env:
          TF_VAR_aliyun_access_key_id: ${{ secrets.ALI_ACCESS_KEY_ID }}
          TF_VAR_aliyun_access_key_secret: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          TF_VAR_server_public_ip: ${{ vars.SERVER_PUBLIC_IP }}
        run: |
          echo "## Terraform apply output" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY