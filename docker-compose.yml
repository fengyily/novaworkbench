version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novaworkbench-backend
    ports:
      - "9527:9527"
    environment:
      - NOVA_PORT=9527
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Database driver: empty = local SQLite file (default). Set to mysql or
      # postgres plus NOVA_DB_DSN to use an external database, e.g.
      #   NOVA_DB_DRIVER=postgres
      #   NOVA_DB_DSN=postgres://user:pass@db:5432/novaworkbench?sslmode=disable
      #   NOVA_DB_DRIVER=mysql
      #   NOVA_DB_DSN=user:pass@tcp(db:3306)/novaworkbench?parseTime=true&charset=utf8mb4
      - NOVA_DB_DRIVER=${NOVA_DB_DRIVER:-}
      - NOVA_DB_DSN=${NOVA_DB_DSN:-}
    volumes:
      - ~/.novaworkbench:/root/.novaworkbench
      - ${HOME}/workspace:${HOME}/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: novaworkbench-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://backend:9527
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    restart: unless-stopped
