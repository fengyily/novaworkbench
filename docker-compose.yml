version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novaworkbench-backend
    ports:
      - "9527:9527"
    environment:
      - NOVA_PORT=9527
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Default: install missing deps at startup (NOVA_AUTOINSTALL=1).
      # Set to "0" to skip — install manually via the settings page instead.
      - NOVA_AUTOINSTALL=${NOVA_AUTOINSTALL:-1}
      # Database driver: empty = local SQLite file (default). Set to mysql or
      # postgres plus NOVA_DB_DSN to use an external database, e.g.
      #   NOVA_DB_DRIVER=postgres
      #   NOVA_DB_DSN=postgres://user:pass@db:5432/novaworkbench?sslmode=disable
      #   NOVA_DB_DRIVER=mysql
      #   NOVA_DB_DSN=user:pass@tcp(db:3306)/novaworkbench?parseTime=true&charset=utf8mb4
      - NOVA_DB_DRIVER=${NOVA_DB_DRIVER:-}
      - NOVA_DB_DSN=${NOVA_DB_DSN:-}
    volumes:
      # Container runs as the non-root `nova` user (UID 1000) — the Claude
      # CLI refuses --dangerously-skip-permissions under uid 0. mount paths
      # mirror the nova user's HOME; the entrypoint chowns the bind-mounts
      # on every start so the host's existing dirs keep working.
      - ~/.novaworkbench:/home/nova/.novaworkbench
      - ${HOME}/workspace:/home/nova/workspace
    restart: unless-stopped
    healthcheck:
      # /api/health now includes a deps summary + `ready` flag (true when
      # Claude CLI is installed). The compose-level check still only needs
      # HTTP 200 — `ready` surfaces in the frontend status bar.
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# Frontend service intentionally removed: the Go binary now embeds the SPA
# via //go:embed (see backend/web/embed.go) and serves it at "/" with a
# react-router fallback. For local frontend HMR dev, run separately:
#   cd frontend && npm run dev    (vite on :5173 with /api proxied to :9527)
