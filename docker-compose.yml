version: '3.8'

services:
  backend:
    build:
      # Build context must be the repo root (.), not ./backend, because the
      # Dockerfile references `frontend/...` (stage 1) and `backend/...`
      # (stages 2 & 3) from the context root. CI workflow
      # (.github/workflows/deploy.yml) uses the same context for parity.
      context: .
      dockerfile: backend/Dockerfile
    container_name: novaworkbench-backend
    ports:
      - "9527:9527"
    environment:
      - NOVA_PORT=9527
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Default: install missing deps at startup (NOVA_AUTOINSTALL=1).
      # Set to "0" to skip — install manually via the settings page instead.
      - NOVA_AUTOINSTALL=${NOVA_AUTOINSTALL:-1}
      # Database driver: empty = local SQLite file (default). Set to mysql or
      # postgres plus NOVA_DB_DSN to use an external database, e.g.
      #   NOVA_DB_DRIVER=postgres
      #   NOVA_DB_DSN=postgres://user:pass@db:5432/novaworkbench?sslmode=disable
      #   NOVA_DB_DRIVER=mysql
      #   NOVA_DB_DSN=user:pass@tcp(db:3306)/novaworkbench?parseTime=true&charset=utf8mb4
      - NOVA_DB_DRIVER=${NOVA_DB_DRIVER:-}
      - NOVA_DB_DSN=${NOVA_DB_DSN:-}
    volumes:
      # Container runs as the non-root `node` user (UID 1000, provided by
      # the node base image) — the Claude CLI refuses
      # --dangerously-skip-permissions under uid 0. Mount paths mirror the
      # node user's HOME; the entrypoint chowns the bind-mounts on every
      # start so the host's existing dirs keep working.
      - ~/.novaworkbench:/home/node/.novaworkbench
      - ${HOME}/workspace:/home/node/workspace
      # Persist claude CLI session transcripts + plan files into the
      # Nova-scoped host dir (keeps the developer's personal ~/.claude
      # untouched). Nova-scoped follows the dev convention of keeping all
      # Nova state under ~/.novaworkbench. Entrypoint chowns the bind-mount
      # to node (UID 1000) on every start.
      - ~/.novaworkbench/claude:/home/node/.claude
    restart: unless-stopped
    healthcheck:
      # /api/health now includes a deps summary + `ready` flag (true when
      # Claude CLI is installed). The compose-level check still only needs
      # HTTP 200 — `ready` surfaces in the frontend status bar.
      test: ["CMD", "wget", "-qO-", "http://localhost:9527/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# Frontend service intentionally removed: the Go binary now embeds the SPA
# via //go:embed (see backend/web/embed.go) and serves it at "/" with a
# react-router fallback. For local frontend HMR dev, run separately:
#   cd frontend && npm run dev    (vite on :5173 with /api proxied to :9527)
